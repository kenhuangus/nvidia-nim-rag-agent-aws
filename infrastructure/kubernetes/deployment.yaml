apiVersion: apps/v1
kind: Deployment
metadata:
  name: nim-rag-agent
  namespace: nim-rag-agent
  labels:
    app: nim-rag-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nim-rag-agent
  template:
    metadata:
      labels:
        app: nim-rag-agent
    spec:
      containers:
      - name: nim-rag-agent
        image: nim-rag-agent:latest  # Replace with your Docker image
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NIM_API_KEY
          valueFrom:
            secretKeyRef:
              name: nim-api-key
              key: NIM_API_KEY
        envFrom:
        - configMapRef:
            name: nim-rag-agent-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: chroma-data
          mountPath: /data/chroma
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: chroma-data
        persistentVolumeClaim:
          claimName: chroma-data
